<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Offres plateforme</title>
</head>
<body>
<section layout:fragment="content" class="page-inner">
    <div class="container">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
            <div>
                <h1 class="page-hero-title mb-0">Offres plateforme</h1>
                <p class="page-hero-sub mb-0">Supervision en lecture seule — toutes les annonces.</p>
            </div>
            <a class="btn btn-outline-secondary" th:href="@{/admin/dashboard}">← Dashboard</a>
        </div>

        <div class="alert alert-info border-0">Lecture seule : aucune modification d'offre depuis cet espace.</div>

        <form class="hh-card mb-4" method="get" th:action="@{/admin/offres}">
            <div class="row g-2">
                <div class="col-md-2">
                    <label class="form-label small">Statut</label>
                    <select class="form-select" name="statut">
                        <option value="">Tous</option>
                        <option value="BROUILLON" th:selected="${statut == 'BROUILLON'}">Brouillon</option>
                        <option value="PUBLIEE" th:selected="${statut == 'PUBLIEE'}">Publiée</option>
                        <option value="FERMEE" th:selected="${statut == 'FERMEE'}">Fermée</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label small">Ville</label>
                    <input class="form-control" name="ville" th:value="${ville}"/>
                </div>
                <div class="col-md-2">
                    <label class="form-label small">Contrat</label>
                    <input class="form-control" name="typeContrat" th:value="${typeContrat}" placeholder="CDI, CDD…"/>
                </div>
                <div class="col-md-2">
                    <label class="form-label small">Recruteur (email)</label>
                    <input class="form-control" name="recruteurEmail" th:value="${recruteurEmail}"/>
                </div>
                <div class="col-md-3">
                    <label class="form-label small">Mot-clé</label>
                    <input class="form-control" name="motCle" th:value="${motCle}"/>
                </div>
                <div class="col-md-1 d-flex align-items-end">
                    <button class="btn hh-btn-primary w-100" type="submit">Filtrer</button>
                </div>
            </div>
        </form>

        <div class="hh-table-wrap">
            <table class="table table-hover mb-0 align-middle">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Titre</th>
                    <th>Recruteur</th>
                    <th>Ville</th>
                    <th>Statut</th>
                    <th>Candidatures</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(rows)}">
                    <td colspan="7" class="text-center text-muted py-4">Aucune offre pour ces filtres.</td>
                </tr>
                <tr th:each="row : ${rows}">
                    <td th:text="${row.offre().id}">1</td>
                    <td class="fw-medium" th:text="${row.offre().titre}">Titre</td>
                    <td class="small" th:text="${row.offre().recruteurEmail}">email</td>
                    <td th:text="${row.offre().ville}">Ville</td>
                    <td>
                        <span class="badge rounded-pill"
                              th:classappend="${row.offre().statut == 'PUBLIEE'} ? ' bg-success' : (${row.offre().statut == 'FERMEE'} ? ' bg-secondary' : ' bg-warning text-dark')"
                              th:text="${row.offre().statut}">PUBLIEE</span>
                    </td>
                    <td th:text="${row.candidatureCount()}">0</td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/offres/{id}(id=${row.offre().id})}">Détail</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <nav class="mt-3" th:if="${page.totalPages > 1}">
            <ul class="pagination">
                <li class="page-item" th:classappend="${page.number == 0} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/admin/offres(page=${page.number - 1}, statut=${statut}, ville=${ville}, typeContrat=${typeContrat}, motCle=${motCle}, recruteurEmail=${recruteurEmail})}">Préc.</a>
                </li>
                <li class="page-item disabled">
                    <span class="page-link" th:text="${page.number + 1} + ' / ' + ${page.totalPages}">1 / 1</span>
                </li>
                <li class="page-item" th:classappend="${page.number + 1 >= page.totalPages} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/admin/offres(page=${page.number + 1}, statut=${statut}, ville=${ville}, typeContrat=${typeContrat}, motCle=${motCle}, recruteurEmail=${recruteurEmail})}">Suiv.</a>
                </li>
            </ul>
        </nav>
    </div>
</section>
</body>
</html>
