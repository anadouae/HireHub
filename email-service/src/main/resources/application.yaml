spring:
  application:
    name: email-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  rabbitmq:
    host: localhost
    port: 5672
    username: hirehub
    password: hirehub
    virtual-host: /
    connection-timeout: 10000
    listener:
      simple:
        prefetch: 1
        default-requeue-rejected: true
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 1.0

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:noreply@hirehub.local}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
            required: false
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  datasource:
    url: jdbc:postgresql://localhost:55432/hirehub_email
    username: hirehub
    password: hirehub
    driver-class-name: org.postgresql.Driver
    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
app:
  jwt:
    # Clé secrète générée aléatoirement (ici encodée en Base64 pour plus de propreté)
    secret-key: "dGhpcy1pcy1hLXZlcnktc2VjdXJlLWtleS1hbmQtbXVzdC1iZS1hdC1sZWFzdC0yNTYtYml0cw=="
    # Temps d'expiration en millisecondes (Exemple : 1 heure -> 60 * 60 * 1000)
    expiration-time: 3600000

# Configuration pour l'idempotence et le traitement des événements
notification:
  idempotence:
    enabled: true
    ttl-days: 30
  rabbitmq:
    max-retries: 3
    retry-delay-ms: 1000

server:
  port: ${SERVER_PORT:8093}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
